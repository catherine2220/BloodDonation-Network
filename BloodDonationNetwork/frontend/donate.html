<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Blood - BloodConnect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>🩸 BloodConnect</h2>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="donate.html">Donate Blood</a>
        <a href="request.html">Request Blood</a>
        <a href="find.html">Find Donor</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<section class="about">
    <h2>Become a Blood Donor</h2>

    <div class="card" style="width: 500px; margin: auto;">

        <form id="donorForm">

            <input type="text" id="name" placeholder="Full Name" required><br><br>

            <input type="number" id="age" placeholder="Age" required><br><br>

            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select><br><br>

            <select id="bloodGroup" required>
                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>O+</option>
                <option>O-</option>
                <option>AB+</option>
                <option>AB-</option>
            </select><br><br>

            <input type="tel" id="phone" placeholder="Phone Number" required><br><br>

            <input type="email" id="email" placeholder="Email"><br><br>

            <input type="text" id="location" placeholder="Location" required><br><br>

            <select id="availability" required>
                <option value="">Availability</option>
                <option>Available</option>
                <option>Not Available</option>
            </select><br><br>

            <button type="submit">Register as Donor</button>

        </form>

    </div>
</section>

<footer>
    <p>© 2026 BloodConnect | Blood Donation Network</p>
</footer>

<script>
document.getElementById("donorForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const donor = {
        name: document.getElementById("name").value,
        age: document.getElementById("age").value,
        gender: document.getElementById("gender").value,
        bloodGroup: document.getElementById("bloodGroup").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        location: document.getElementById("location").value,
        availability: document.getElementById("availability").value
    };

    fetch("http://localhost:8080/donors", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(donor)
    })
    .then(response => response.json())
    .then(data => {
        alert("Donor registered successfully!");
        document.getElementById("donorForm").reset();
    })
    .catch(error => {
        alert("Error registering donor!");
        console.error(error);
    });

});
</script>

</body>
</html>
