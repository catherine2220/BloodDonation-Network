```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Blood - BloodConnect</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .request-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .request-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .request-card h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .request-card input,
        .request-card select {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .request-card button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>BloodConnect</h1>
</header>

<div class="request-container">

    <div class="request-card">

        <h2>🩸 Request Blood</h2>

        <form id="requestForm">

            <input type="text" id="patientName"
                   placeholder="Patient Name" required>

            <input type="number" id="patientAge"
                   placeholder="Patient Age" required>

            <select id="bloodGroup" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <input type="number" id="unitsRequired"
                   placeholder="Units Required" required>

            <input type="text" id="hospitalName"
                   placeholder="Hospital Name" required>

            <input type="text" id="hospitalLocation"
                   placeholder="Hospital Location" required>

            <input type="tel" id="phone"
                   placeholder="Phone Number" required>

            <select id="urgencyLevel" required>
                <option value="">Select Urgency Level</option>
                <option value="Emergency">Emergency</option>
                <option value="Urgent">Urgent</option>
                <option value="Normal">Normal</option>
            </select>

            <button type="submit">
                Request Blood
            </button>

        </form>

    </div>

</div>

<script>

document.getElementById("requestForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    /*
       First URL-la patientId check pannum.
       URL-la illa na sessionStorage-la check pannum.
    */

    const urlParams =
        new URLSearchParams(window.location.search);

    let patientId =
        urlParams.get("patientId");

    if (!patientId) {

        patientId =
            sessionStorage.getItem("patientId");
    }

    /*
       Rendu place-layum ID illa na mattum error
    */

    if (!patientId) {

        alert(
            "Patient details not found. Please register again."
        );

        window.location.href =
            "patient.html";

        return;
    }

    const request = {

        patientId: parseInt(patientId),

        patientName:
            document.getElementById("patientName").value,

        patientAge:
            parseInt(
                document.getElementById("patientAge").value
            ),

        bloodGroup:
            document.getElementById("bloodGroup").value,

        unitsRequired:
            parseInt(
                document.getElementById("unitsRequired").value
            ),

        hospitalName:
            document.getElementById("hospitalName").value,

        hospitalLocation:
            document.getElementById("hospitalLocation").value,

        phone:
            document.getElementById("phone").value,

        urgencyLevel:
            document.getElementById("urgencyLevel").value
    };

    try {

        const response =
            await fetch(
"https://blooddonation-network.onrender.com/blood-requests",               {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(request)
                }
            );

        if (response.ok) {

            const savedRequest =
                await response.json();

            sessionStorage.setItem(
                "requestId",
                savedRequest.requestId
            );

            sessionStorage.setItem(
                "patientName",
                savedRequest.patientName
            );

            sessionStorage.setItem(
                "bloodGroup",
                savedRequest.bloodGroup
            );

            sessionStorage.setItem(
                "unitsRequired",
                savedRequest.unitsRequired
            );

            sessionStorage.setItem(
                "hospitalName",
                savedRequest.hospitalName
            );

            sessionStorage.setItem(
                "hospitalLocation",
                savedRequest.hospitalLocation
            );

            sessionStorage.setItem(
                "urgencyLevel",
                savedRequest.urgencyLevel
            );

            alert(
                "Blood request submitted successfully!"
            );

            // After submitting request, go to Find Donor
            window.location.href =
                "find.html";

        } else {

            alert(
                "Failed to submit blood request."
            );
        }

    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to server. Please check the backend."
        );
    }

});

</script>

</body>
</html>
