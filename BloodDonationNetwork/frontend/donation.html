<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Record Donation - BloodConnect</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .donation-section {
            min-height: 600px;
            padding: 45px 20px;
            text-align: center;
        }

        .donation-section h2 {
            color: #b22222;
            margin-bottom: 25px;
        }

        .donation-card {
            width: 450px;
            max-width: 90%;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: left;
        }

        .donation-card h3 {
            color: #b22222;
            margin-top: 0;
        }

        .donation-card p {
            margin: 12px 0;
        }

        .donation-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .donate-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background: #b22222;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .donate-btn:hover {
            opacity: 0.85;
        }

    </style>

</head>

<body>

<nav>

    <h2>🩸 BloodConnect</h2>

    <div class="nav-links">

        <a href="index.html">Home</a>
        <a href="donate.html">Donate Blood</a>
        <a href="request.html">Request Blood</a>
        <a href="find.html">Find Donor</a>
        <a href="donor-requests.html">Donation Requests</a>
        <a href="donation.html">Record Donation</a>
        <a href="status.html">Request Status</a>
        <a href="contact.html">Contact</a>

    </div>

</nav>


<section class="donation-section">

    <h2>Record Blood Donation</h2>

    <div class="donation-card">

        <h3>🩸 Donation Details</h3>

        <p>
            <strong>Donor:</strong>
            <span id="donorName"></span>
        </p>

        <p>
            <strong>Patient:</strong>
            <span id="patientName"></span>
        </p>

        <p>
            <strong>Blood Group:</strong>
            <span id="bloodGroup"></span>
        </p>

        <p>
            <strong>Hospital:</strong>
            <span id="hospitalName"></span>
        </p>

        <label>
            <strong>Units Donated:</strong>
        </label>

        <input
            type="number"
            id="units"
            value="1"
            min="1"
            required
        >

        <button
            class="donate-btn"
            onclick="recordDonation()">

            Record Donation

        </button>

    </div>

</section>


<footer>

    <p>© 2026 BloodConnect | Blood Donation Network</p>

</footer>


<script>

/* Get request details */

const requestId =
    sessionStorage.getItem("requestId");

const patientName =
    sessionStorage.getItem("patientName");

const bloodGroup =
    sessionStorage.getItem("bloodGroup");

const hospitalName =
    sessionStorage.getItem("hospitalName");


/* Get selected donor */

const savedDonor =
    sessionStorage.getItem("selectedDonor");


if (!requestId || !savedDonor) {

    alert(
        "Donation details not found!"
    );

    window.location.href =
        "find.html";

}


/* Display donor and request details */

const donor =
    JSON.parse(savedDonor);


document.getElementById("donorName").textContent =
    donor.name;

document.getElementById("patientName").textContent =
    patientName;

document.getElementById("bloodGroup").textContent =
    bloodGroup;

document.getElementById("hospitalName").textContent =
    hospitalName;



/* RECORD DONATION */

async function recordDonation() {

    const units =
        document.getElementById("units").value;


    if (units === "" || units <= 0) {

        alert(
            "Please enter valid units!"
        );

        return;

    }


    const donation = {

        donorId: donor.donorId,

        requestId: parseInt(requestId),

        donationDate:
            new Date()
                .toISOString()
                .split("T")[0],

        unitsDonated:
            parseInt(units),

        matchStatus:
            "Matched"

    };


    try {

        /* Step 1: Save donation */

        const donationResponse =
            await fetch(
               "https://blooddonation-network.onrender.com/donations",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(donation)

                }
            );


        if (!donationResponse.ok) {

            throw new Error(
                "Failed to record donation"
            );

        }


        /* Step 2: Update actual request */

        const statusResponse =
            await fetch(
                "http://localhost:8080/blood-requests/" +
                requestId +
                "/status?status=Fulfilled",
                {
                    method: "PUT"
                }
            );


        if (!statusResponse.ok) {

            throw new Error(
                "Failed to update request status"
            );

        }


        /* Step 3: Success */

        alert(
            "Donation recorded successfully!"
        );


        window.location.href =
            "status.html?status=Fulfilled&donorName=" +
            encodeURIComponent(donor.name);

    }

    catch (error) {

        console.error(error);

        alert(
            "Error recording donation!"
        );

    }

}

</script>

</body>

</html>
